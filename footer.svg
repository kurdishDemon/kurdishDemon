<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="session terminated" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity="0.035"/></pattern>
    <style>
      .m{font-family:'Courier New',Courier,monospace}
      .b{animation:bl 1.1s steps(1) infinite}
      @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="110" fill="#000"/>
  <rect y="0" width="1200" height="1" fill="#c8102e" opacity="0.7"/>
  <text x="600" y="50" text-anchor="middle" class="m" font-size="16" fill="#6e7681" letter-spacing="3">every system has a weakness. mine is shipping at 4 am.</text>
  <text x="600" y="82" text-anchor="middle" class="m" font-size="15" fill="#c8102e" letter-spacing="4">[ session terminated ]<tspan class="b">_</tspan></text>
  <rect width="1200" height="110" fill="url(#scan)"/>
</svg>
