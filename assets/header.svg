<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="KurdishDemon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#c8102e" stroke-width="0.5" opacity="0.10"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#c8102e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c8102e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8102e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c8102e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c8102e" stop-opacity="0"/>
    </linearGradient>
    <text id="t" x="600" y="222" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="118" font-weight="700" textLength="900" lengthAdjust="spacingAndGlyphs">KURDISHDEMON</text>
    <clipPath id="b1"><rect x="0" y="128" width="1200" height="26"/></clipPath>
    <clipPath id="b2"><rect x="0" y="168" width="1200" height="18"/></clipPath>
    <clipPath id="b3"><rect x="0" y="196" width="1200" height="30"/></clipPath>
    <style>
      .mono{font-family:'Courier New',Courier,monospace}
      .flick{animation:fl 5s infinite}
      .ghostL{animation:gl 3.2s steps(1) infinite}
      .ghostR{animation:gr 3.2s steps(1) infinite}
      .s1{animation:g1 4s steps(1) infinite}
      .s2{animation:g2 4s steps(1) infinite .35s}
      .s3{animation:g1 5.5s steps(1) infinite 1.4s}
      .blink{animation:bl 1.1s steps(1) infinite}
      .rec{animation:bl 1.6s steps(1) infinite}
      .bar{animation:sw 7s linear infinite}
      @keyframes fl{0%,46%,50%,79%,82%,100%{opacity:1}47%{opacity:.5}49%{opacity:.8}80%{opacity:.7}}
      @keyframes gl{0%,100%{transform:translate(-5px,0)}30%{transform:translate(-9px,1px)}32%{transform:translate(-3px,0)}70%{transform:translate(-12px,-1px)}72%{transform:translate(-5px,0)}}
      @keyframes gr{0%,100%{transform:translate(5px,0)}30%{transform:translate(8px,-1px)}32%{transform:translate(4px,0)}70%{transform:translate(11px,1px)}72%{transform:translate(5px,0)}}
      @keyframes g1{0%,90%,98%,100%{opacity:0;transform:translateX(0)}91%{opacity:1;transform:translateX(-26px)}93%{opacity:1;transform:translateX(18px)}95%{opacity:1;transform:translateX(-8px)}97%{opacity:1;transform:translateX(30px)}}
      @keyframes g2{0%,60%,66%,100%{opacity:0;transform:translateX(0)}61%{opacity:1;transform:translateX(22px)}63%{opacity:1;transform:translateX(-30px)}65%{opacity:1;transform:translateX(10px)}}
      @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes sw{0%{transform:translateY(-120px)}100%{transform:translateY(400px)}}
    </style>
  </defs>

  <rect width="1200" height="380" fill="#000"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>

  <g class="flick">
    <use xlink:href="#t" href="#t" fill="#c8102e" opacity="0.85" class="ghostL"/>
    <use xlink:href="#t" href="#t" fill="#5c0a14" opacity="0.9" class="ghostR"/>
    <use xlink:href="#t" href="#t" fill="#f0f0f0"/>
    <g clip-path="url(#b1)"><g class="s1" opacity="0"><use xlink:href="#t" href="#t" fill="#c8102e"/></g></g>
    <g clip-path="url(#b2)"><g class="s2" opacity="0"><use xlink:href="#t" href="#t" fill="#ffffff"/></g></g>
    <g clip-path="url(#b3)"><g class="s3" opacity="0"><use xlink:href="#t" href="#t" fill="#c8102e"/></g></g>
  </g>

  <rect x="150" y="252" width="900" height="1" fill="#c8102e" opacity="0.7"/>
  <text x="600" y="290" text-anchor="middle" class="mono" font-size="21" fill="#8b949e" letter-spacing="3">&gt; full-stack · servers · zero public repos<tspan class="blink" fill="#c8102e">█</tspan></text>

  <g fill="none" stroke="#c8102e" stroke-width="3">
    <path d="M30 70V30H70"/><path d="M1130 30H1170V70"/>
    <path d="M30 310V350H70"/><path d="M1130 350H1170V310"/>
  </g>
  <g class="mono" font-size="14" fill="#8b949e" letter-spacing="2">
    <text x="50" y="62">// node: kd-01</text>
    <text x="50" y="334">uid=0(root) gid=0(root)</text>
    <text x="1150" y="334" text-anchor="end">0xDEAD · 0xC0DE</text>
  </g>
  <g class="rec">
    <circle cx="1085" cy="57" r="6" fill="#c8102e"/>
    <text x="1150" y="62" text-anchor="end" class="mono" font-size="14" fill="#c8102e" letter-spacing="2">REC</text>
  </g>

  <rect class="bar" width="1200" height="120" fill="url(#sweep)"/>
  <rect width="1200" height="380" fill="url(#scan)"/>
  <rect width="1200" height="380" fill="url(#vig)"/>
</svg>
